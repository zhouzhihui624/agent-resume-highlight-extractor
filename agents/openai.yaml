interface:
  display_name: "AI Agent 简历亮点提取"
  short_description: "把 AI 项目证据整理成有主线、能讲透的实习面试故事"
  default_prompt: "使用 $agent-resume-highlight-extractor 检查项目证据，先还原工程问题、真实起点、内容来源和实现链，再选择能够形成完整故事的实习生可信职责。长文档先用半页快速复习和一张中文总流程图建立主线，再按 2-4 个自然阶段说明每一步的输入、关键动作和输出；多个机制要讲清为什么接力，基础内容、按需加载内容和最终产物要明确区分。最后从同一主线生成简历和面试表达，并补充结果价值与事实边界。"
